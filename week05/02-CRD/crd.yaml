apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiopses.aiops.geektime.com
spec:
  group: aiops.geektime.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                classCount:
                  type: integer
                  description: Includes number of classes
                isCompleted:
                  type: boolean
                  description: Course completion status
            status:
              type: object
  scope: Namespaced
  names:
    plural: aiopses
    singular: aiops
    kind: AIOps
    shortNames:
      - aiops